name: Build LEVI EXTERNAL Menu

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Compile Swift Menu
      run: |
        mkdir -p build
        xcrun swiftc -emit-library \
               -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
               -target arm64-apple-ios14.0 \
               LeviMenu.swift -o build/LeviExternalMenu.dylib

    - name: Upload Dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LeviExternalMenu-Dylib
        path: build/LeviExternalMenu.dylib
