name: Build LEVI EXTERNAL Menu

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Compile Swift Menu
      run: |
        mkdir -p build
        swiftc -emit-library -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
               -target arm64-apple-ios14.0 \
               LeviMenu.swift -o build/LeviExternalMenu.dylib

    - name: Upload Dylib Artifact
      uses: actions/upload-artifact@v3
      with:
        name: LeviExternalMenu-Dylib
        path: build/LeviExternalMenu.dylib
